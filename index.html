<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BonView</title>
<meta name="description" content="본문만 남기는 텍스트·웹페이지 리더">
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --link: #0066cc; --line: #e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --link: #2997ff; --line: #2c2c2e; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 40px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  ul { padding-left: 20px; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
  footer a { color: var(--link); text-decoration: none; margin-right: 16px; }
</style>
</head>
<body>
<main>
  <h1>BonView</h1>
  <p class="sub">본문만 남기는 텍스트·웹페이지 리더 · iPhone</p>
  <p>BonView는 읽기 도구입니다. 가지고 있는 텍스트 파일이나 직접 입력한 웹페이지 주소에서 본문만 뽑아내, 읽기 편한 화면으로 다시 보여줍니다.</p>
  <ul>
    <li>본문만 남기는 읽기 모드</li>
    <li>페이지 넘김과 스크롤 중 편한 읽기 방식</li>
    <li>글꼴·글자 크기·테마·여백 조절</li>
    <li>읽던 위치를 기억하는 서재</li>
  </ul>
  <p>BonView는 어떤 콘텐츠도 제공하지 않습니다. 이용자가 가진 파일과 이용자가 입력한 주소의 내용만 보여줍니다.</p>
  <footer>
    <a href="https://sites.google.com/view/bonview-app">개인정보 처리방침</a>
    <a href="https://sites.google.com/view/bonview-app/support">지원</a>
  </footer>
</main>
</body>
</html>
